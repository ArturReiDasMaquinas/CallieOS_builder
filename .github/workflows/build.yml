name: Build CallieOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar dispositivos de Loop
        run: |
          sudo modprobe loop
          sudo mknod -m 0660 /dev/loop-control c 10 237 || true
          for i in $(seq 0 7); do
            sudo mknod -m 0660 /dev/loop$i b 7 $i || true
          done

      - name: Criar e Executar Script de Compilação
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/bash
          set -e

          echo "=== 1. Atualizando Chaves e Pacotes Base ==="
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso mkinitcpio git rsync dos2unix syslinux mtools dosfstools squashfs-tools libisoburn edk2-ovmf erofs-utils grub python base-devel imagemagick

          echo "=== 1.1. Compilando e Instalando o libpamac-aur e Pamac ==="
          useradd -m aurbuilder
          passwd -d aurbuilder
          printf 'aurbuilder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers.d/aurbuilder
          chown -R aurbuilder:aurbuilder /workspace

          su - aurbuilder -c "cd /workspace && \
            git clone https://aur.archlinux.org/libpamac-aur.git && \
            cd libpamac-aur && \
            makepkg -s --noconfirm && \
            sudo pacman -U --noconfirm *.pkg.tar.zst && \
            cd /workspace && \
            git clone https://aur.archlinux.org/pamac-aur.git && \
            cd pamac-aur && \
            makepkg -s --noconfirm"

          echo "=== 2. Entrando na pasta do projeto ==="
          if [ -d "CallieOS_builder" ]; then
            cd CallieOS_builder
          else
            mkdir -p CallieOS_builder
            cd CallieOS_builder
          fi

          mkdir -p out

          echo "=== 3. Copiando arquivos base do releng com seguranca ==="
          rsync -avI /usr/share/archiso/configs/releng/ .

          find . -type f \( -name "*.sh" -o -name "packages.x86_64" -o -name "profiledef.sh" -o -name "pacman.conf" -o -name "mkinitcpio.conf" \) -exec dos2unix {} + 2>/dev/null || true

          sed -i '/xf86-video-vmware/d' packages.x86_64 2>/dev/null || true

          echo "=== 3.1. Rebranding Completo: Substituindo Arch Linux por CallieOS no Boot e Configs ==="
          find . -type f \( -name "*.cfg" -o -name "*.conf" -o -name "*.sh" -o -name "issue*" -o -name "grup*" \) -exec sed -i 's/Arch Linux/CallieOS/g' {} + || true
          find . -type f \( -name "*.cfg" -o -name "*.conf" -o -name "*.sh" -o -name "issue*" -o -name "grup*" \) -exec sed -i 's/archiso/callieos/g' {} + || true
          find . -type f \( -name "*.cfg" -o -name "*.conf" -o -name "*.sh" -o -name "issue*" -o -name "grup*" \) -exec sed -i 's/Archiso/CallieOS/g' {} + || true

          echo "=== 3.2. Configurando multilib e Repositório Local no pacman.conf da ISO ==="
          sed -i '/^#\[multilib\]/{s/^#//;n;s/^#//}' pacman.conf

          mkdir -p localrepo
          cp /home/aurbuilder/libpamac-aur/*.pkg.tar.zst localrepo/ 2>/dev/null || cp /workspace/libpamac-aur/*.pkg.tar.zst localrepo/ || true
          cp /home/aurbuilder/pamac-aur/*.pkg.tar.zst localrepo/ 2>/dev/null || cp /workspace/pamac-aur/*.pkg.tar.zst localrepo/ || true
          repo-add localrepo/localrepo.db.tar.gz localrepo/*.pkg.tar.zst

          echo -e "\n[localrepo]\nSigLevel = Optional TrustAll\nServer = file://$(pwd)/localrepo" >> pacman.conf

          echo "=== 4. Injetando Pacotes Gráficos, XFCE, Jogos, Flatpak e Pamac ==="
          PKGS="base linux linux-firmware base-devel sudo git curl wget nano micro bash-completion networkmanager network-manager-applet iwd wpa_supplicant wireless-regdb usb_modeswitch dhcpcd syslinux archinstall fastfetch xorg-server xorg-xinit mesa xfce4 xfce4-goodies lightdm lightdm-gtk-greeter accountsservice steam lutris flatpak pamac-aur"
          for pkg in $PKGS; do
            grep -q "^${pkg}$" packages.x86_64 || echo "$pkg" >> packages.x86_64
          done

          echo "=== 5. Criando Estruturas e Pastas Globais no airootfs ==="
          mkdir -p airootfs/usr/local/bin
          mkdir -p airootfs/etc/profile.d
          mkdir -p airootfs/etc/fastfetch
          mkdir -p airootfs/usr/share/fastfetch
          mkdir -p airootfs/usr/share/pixmaps
          mkdir -p airootfs/usr/share/backgrounds/callie
          mkdir -p airootfs/var/lib/AccountsService/users
          mkdir -p airootfs/etc/lightdm
          mkdir -p airootfs/etc/pam.d
          mkdir -p airootfs/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml

          echo "=== 5.1. Definindo Nome do Sistema e Mensagem de Boot ==="
          echo "callieos" > airootfs/etc/hostname
          
          cat << 'HOSTS' > airootfs/etc/hosts
          127.0.0.1   localhost
          ::1         localhost
          127.0.1.1   callieos.localdomain   callieos
          HOSTS

          echo -e "\n\033[1;95mWelcome to CallieOS! (\n) (\l)\033[0m\n" > airootfs/etc/issue
          echo "Welcome to CallieOS!" > airootfs/etc/issue.net

          echo "=== 5.2. Gerando Assets Visuais (Logo e Wallpaper CallieOS) ==="
          convert -size 256x256 xc:transparent \
            -fill "#9b59b6" -draw "circle 128,128 128,20" \
            -fill white -pointsize 120 -gravity center -annotate +0+0 "C" \
            airootfs/usr/share/pixmaps/CallieLogo.png

          convert -size 1920x1080 gradient:"#1a0033"-"#3b0066" \
            -fill "#ff77ff" -pointsize 72 -gravity center -annotate +0-40 "CALLIE OS" \
            -fill "#cccccc" -pointsize 28 -gravity center -annotate +0+30 "Stay Fresh!" \
            airootfs/usr/share/backgrounds/callie/wallpaper.png

          echo "=== 5.3. Configurando XFCE Desktop para aplicar Wallpaper Automático ==="
          cat << 'XFCEXML' > airootfs/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="image-path" type="string" value="/usr/share/backgrounds/callie/wallpaper.png"/>
                  <property name="image-style" type="int" value="5"/>
                </property>
              </property>
            </property>
          </channel>
          XFCEXML

          echo "=== 6. Criando o Instalador Tematico CallieOS ==="
          cat << 'INSTALLER' > airootfs/usr/local/bin/callie-install
          #!/bin/bash
          clear
          echo -e "\033[1;95m"
          echo "  ____________________________________________________"
          echo " /                                                    \\"
          echo " |                CALLIE OS - Stay Fresh!             |"
          echo " |                     Installation                   |"
          echo " \\____________________________________________________/"
          echo -e "\033[0m"
          echo -e "\033[1;35m[System]: Launching...\033[0m"
          echo -e "\033[1;36m[System]: archinstall loaded.\033[0m\n"

          archinstall
          INSTALLER
          chmod +x airootfs/usr/local/bin/callie-install

          cat << 'ALIASES' > airootfs/etc/profile.d/callie_aliases.sh
          alias instalar='/usr/local/bin/callie-install'
          alias install='/usr/local/bin/callie-install'
          alias callie-install='/usr/local/bin/callie-install'
          ALIASES
          chmod +x airootfs/etc/profile.d/callie_aliases.sh

          echo "=== 7. Configurando LightDM, Pam e Auto-login ==="
          cat << 'LIGHTDMCONF' > airootfs/etc/lightdm/lightdm.conf
          [Seat:*]
          autologin-user=callieuser
          autologin-user-timeout=0
          user-session=xfce
          greeter-session=lightdm-gtk-greeter
          LIGHTDMCONF

          cat << 'PAMAUTOLOGIN' > airootfs/etc/pam.d/lightdm-autologin
          #%PAM-1.0
          auth     required pam_env.so
          auth     required pam_permit.so
          account  include lightdm
          password include lightdm
          session  include lightdm
          PAMAUTOLOGIN

          echo "fastfetch" >> airootfs/etc/bash.bashrc

          echo "=== 8. Script de Pós-Instalação da Live (Usuario, Grupos e Identidade) ==="
          mkdir -p airootfs/root/
          cat << 'CUSTOMIZE' > airootfs/root/customize_airootfs.sh
          #!/bin/bash
          groupadd -r autologin
          useradd -m -G wheel,audio,video,storage,autologin -s /bin/bash callieuser
          gpasswd -a callieuser autologin
          echo "callieuser:1234" | chpasswd
          
          chown -R callieuser:callieuser /home/callieuser
          chmod 700 /home/callieuser

          echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/wheel

          # Sobrescrevendo o os-release com segurança pós-pacotes
          cat << 'OSREL' > /etc/os-release
          NAME="CallieOS"
          ID="callieos"
          ID_LIKE="arch"
          BUILD_ID=ROLLING
          ANSI_COLOR="38,2,155,89,182"
          HOME_URL="https://github.com/"
          SUPPORT_URL="https://github.com/"
          BUG_REPORT_URL="https://github.com/"
          PRETTY_NAME="CallieOS - Stay Fresh!"
          OSREL
          ln -sf /etc/os-release /usr/lib/os-release

          systemctl enable lightdm
          CUSTOMIZE
          chmod +x airootfs/root/customize_airootfs.sh

          cat << 'ACC' > airootfs/var/lib/AccountsService/users/callieuser
          [User]
          Session=xfce
          Icon=/usr/share/pixmaps/CallieLogo.png
          SystemAccount=false
          ACC

          echo "=== 9. Sincronizando Bootmodes ==="
          echo "import re" > patch_profile.py
          echo "releng_path = '/usr/share/archiso/configs/releng/profiledef.sh'" >> patch_profile.py
          echo "with open(releng_path, 'r') as f:" >> patch_profile.py
          echo "    releng = f.read()" >> patch_profile.py
          echo "bm_match = re.search(r'bootmodes=\([\s\S]*?\)', releng)" >> patch_profile.py
          echo "if bm_match:" >> patch_profile.py
          echo "    bm = bm_match.group(0)" >> patch_profile.py
          echo "    with open('profiledef.sh', 'r') as f:" >> patch_profile.py
          echo "        target = f.read()" >> patch_profile.py
          echo "    new_target = re.sub(r'bootmodes=\([\s\S]*?\)', bm, target)" >> patch_profile.py
          echo "    with open('profiledef.sh', 'w') as f:" >> patch_profile.py
          echo "        f.write(new_target)" >> patch_profile.py
          
          python3 patch_profile.py

          echo "=== 10. Gerando a ISO Final do CallieOS ==="
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            mkarchiso -v -w work -o out .
          fi

          echo "=== 11. Limpando diretorio work e ajustando permissoes ==="
          rm -rf work
          chmod -R 777 out
          EOF

          chmod +x run_build.sh

      - name: Executar Build dentro do Container Arch Linux
        run: |
          docker run --privileged \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash /workspace/run_build.sh

      - name: Disponibilizar a ISO para Download
        uses: actions/upload-artifact@v4
        with:
          name: CallieOS-ISO
          path: CallieOS_builder/out/*.iso
